<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="/static/css/materialize.css">
    <link rel="stylesheet" type="text/css" href="/static/css/styles.css">
    <script src="/static/js/materialize.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Добавить товар в доверенность</title>
</head>
<body class="has-fixed-sidenav">
    <header></header>
    <main class="white">
        <div class="container">
            <div class="section">
                <h5>Добавить товар в доверенность №{{.Proxy.Id}}</h5>
                <table class="highlight">
                    <tr>
                        <td>Организация</td>
                        <td>{{.Proxy.Organization}}</td>
                    </tr>
                    <tr>
                        <td>Сотрудник</td>
                        <td>{{.Proxy.Employee}}</td>
                    </tr>
                    <tr>
                        <td>Контрагент</td>
                        <td>{{.Proxy.Customer}}</td>
                    </tr>
                    <tr>
                        <td>Дата выдачи</td>
                        <td>{{.Proxy.DateOfIssue}}</td>
                    </tr>
                    <tr>
                        <td>Действительна до</td>
                        <td>{{.Proxy.IsValidUntil}}</td>
                    </tr>
                </table>

                <form class="col s12" action="/documents/proxies/body/create" method="post">
                    <input name="proxy_id" type="hidden" value="{{.Proxy.Id}}">
                    <div class="row">
                        <div class="input-field col s8">
                            <label>Товар</label>
                            <select name="product_id" class="browser-default">
                                <option value="" disabled selected>Выберите товар</option>
                                {{range .Products}}
                                <option value="{{.Id}}">{{.Name}}</option>
                                {{end}}
                            </select>
                        </div>
                        <div class="input-field col s4">
                            <input id="product_amount" name="product_amount" type="number" class="validate" min="1" step="1">
                            <label for="product_amount">Количество</label>
                        </div>
                    </div>
                    <button class="waves-effect waves-blue btn-flat white blue-text" type="submit">
                        <i class="material-icons left">done</i>Добавить
                    </button>
                </form>
            </div>
        </div>
    </main>
    <script src="/static/js/nav.js"></script>
    <script src="/static/js/sidenav.js"></script>
    <script src="/documents/static/js/sidenav-proxy.js"></script>
</body>
</html>
